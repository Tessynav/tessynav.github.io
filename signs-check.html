<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TessyNav sign converter v2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{font-family:sans-serif;max-width:900px;margin:40px auto;padding:0 16px}
#log{background:#f1f1f1;padding:12px;border-radius:8px;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:14px;margin-bottom:24px}
td,th{border-bottom:1px solid #ddd;padding:6px 8px;text-align:left}
a{display:inline-block;margin:12px 0;font-size:18px}
</style>
</head>
<body>
<h1>TessyNav sign converter v2</h1>
<p>Choose the Montreal road signs CSV file ("Signalisation routière").</p>
<input type="file" id="f" accept=".csv">
<div id="log">Waiting for file...</div>
<div id="kept"></div>
<div id="skipped"></div>
<script>
const T=0.05;
const NAMES={s:'Stop',a:'All-way plate',y:'Yield',o:'One way',x:'No entry',t:'Turn restriction',p:'Pedestrian crossing',
  e:'School zone',w:'Stop ahead',b:'Speed bump ahead',k:'Playground ahead',r:'Bumpy road',c:'Cul-de-sac',
  m1:'Mandatory: straight',m2:'Mandatory: right',m3:'Mandatory: left',m4:'Mandatory: straight or right',
  m5:'Mandatory: straight or left',m6:'Mandatory: right or left',n:'Street name'};
function parseLine(line,d){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===d){out.push(cur);cur='';}
    else cur+=ch;
  }
  out.push(cur);return out;
}
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function classify(desc,code){
  const d=norm(desc),c=norm(code);
  if(/AUTOBUS|\bBUS\b/.test(d)) return null;
  if(/^TOPONYME/.test(d)) return 'n';
  if(/TOUTES LES APPROCHES|TOUTES DIRECTIONS/.test(d)) return 'a';
  if(/SIGNAL AVANCE D.ARRET/.test(d)) return 'w';
  if(c==='RA-A'||/^ARRET\b/.test(d)) return 's';
  if(/CEDEZ/.test(d)) return 'y';
  if(/^MAXIMUM|VITESSE MAX/.test(d)){const m=d.match(/(\d{2,3})/);return m?'v'+m[1]:null;}
  if(/SENS UNIQUE/.test(d)) return 'o';
  if(/ACCES INTERDIT|ENTREE INTERDITE|SENS INTERDIT/.test(d)) return 'x';
  if(/^OBLIG/.test(d)){
    const st=/TOUT DROIT/.test(d),r=/DROITE/.test(d),l=/GAUCHE/.test(d);
    if(st&&r) return 'm4'; if(st&&l) return 'm5'; if(r&&l) return 'm6';
    if(st) return 'm1'; if(r) return 'm2'; if(l) return 'm3';
    return null;
  }
  if(/RALENTISSEUR/.test(d)) return 'b';
  if(/TERRAIN DE JEUX/.test(d)) return 'k';
  if(/ROUTE CAHOTEUSE/.test(d)) return 'r';
  if(/CUL-DE-SAC/.test(d)) return 'c';
  if(/INTERDICTION|INTERDIT|DEMI-TOUR/.test(d)&&/TOURN|VIRA|DEMI-TOUR|DROITE|GAUCHE/.test(d)) return 't';
  if(/PIETON|TRAVERSE/.test(d)) return 'p';
  if(/ECOLE|SCOLAIRE/.test(d)) return 'e';
  return null;
}
document.getElementById('f').onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  const log=document.getElementById('log');
  log.textContent='Reading '+file.name+'...';
  const reader=file.stream().pipeThrough(new TextDecoderStream()).getReader();
  let buf='',header=null,d=',',rows=0,iLon=-1,iLat=-1,iDesc=-1,iCode=-1,iPole=-1,iPos=-1,iTopo=-1;
  const poles=new Map(),kept={},skipped={};
  function handle(line){
    if(!line.trim())return;
    if(!header){
      d=(line.split(';').length>line.split(',').length)?';':',';
      header=parseLine(line.replace(/^\uFEFF/,''),d).map(h=>h.trim());
      const find=re=>header.findIndex(h=>re.test(h));
      iLon=find(/^longitude$/i);iLat=find(/^latitude$/i);
      iDesc=find(/^DESCRIPTION_RPA$/i);iCode=find(/^CODE_RPA$/i);
      iPole=find(/^POTEAU_ID_POT$/i);iPos=find(/^POSITION_POP$/i);iTopo=find(/^TOPONYME/i);
      return;
    }
    const c=parseLine(line,d);rows++;
    const desc=c[iDesc],code=c[iCode];
    let type=classify(desc,code);
    if(!type){const k=norm(desc)||'(empty)';skipped[k]=(skipped[k]||0)+1;return;}
    if(type==='n'){
      const nm=(iTopo>=0?c[iTopo]:'').replace(/[|,]/g,' ').trim();
      if(!nm){return;}
      type='n:'+nm;
    }
    const lng=parseFloat(c[iLon]),lat=parseFloat(c[iLat]);
    if(!isFinite(lng)||!isFinite(lat)||lng<-80||lng>-70||lat<40||lat>50) return;
    const name=type[0]==='v'?'Speed limit '+type.slice(1):(type.indexOf('n:')===0?'Street name':NAMES[type]);
    kept[name]=(kept[name]||0)+1;
    const pid=iPole>=0?c[iPole]:(lng.toFixed(6)+','+lat.toFixed(6));
    let p=poles.get(pid);
    if(!p){p={lng:lng,lat:lat,signs:[]};poles.set(pid,p);}
    const pos=iPos>=0?(+c[iPos]||0):0;
    if(!p.signs.some(s=>s[0]===type)) p.signs.push([type,pos]);
  }
  while(true){
    const {done,value}=await reader.read();
    if(done)break;
    buf+=value;
    const lines=buf.split('\n');buf=lines.pop();
    for(const l of lines)handle(l.replace(/\r$/,''));
    log.textContent='Rows read: '+rows;
  }
  if(buf)handle(buf);
  if(iLon<0||iLat<0||iDesc<0){log.textContent='Could not find the needed columns. Columns found: '+(header||[]).join(', ');return;}
  const tiles={};
  for(const p of poles.values()){
    p.signs.sort((a,b)=>b[1]-a[1]);
    const tx=Math.floor(p.lng/T),ty=Math.floor(p.lat/T),k=tx+'_'+ty;
    (tiles[k]||(tiles[k]=[])).push([Math.round((p.lng-tx*T)*1e5),Math.round((p.lat-ty*T)*1e5),p.signs.map(s=>s[0]).join('|')]);
  }
  const keys=Object.keys(tiles);
  const zip=new JSZip(),dir=zip.folder('signs');
  for(const k of keys)dir.file(k+'.json',JSON.stringify(tiles[k]));
  dir.file('index.json',JSON.stringify({tile:T,tiles:keys}));
  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='signs.zip';a.textContent='Download signs.zip again';
  log.textContent='Done! '+rows+' signs read, '+poles.size+' poles kept, in '+keys.length+' files. signs.zip was downloaded.';
  log.after(a);a.click();
  const kl=Object.entries(kept).sort((x,y)=>y[1]-x[1]);
  document.getElementById('kept').innerHTML='<h3>Signs kept</h3><table>'+kl.map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+v+'</td></tr>').join('')+'</table>';
  const sl=Object.entries(skipped).sort((x,y)=>y[1]-x[1]).slice(0,40);
  document.getElementById('skipped').innerHTML='<h3>Most common signs skipped</h3><table>'+sl.map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+v+'</td></tr>').join('')+'</table>';
};
</script>
</body>
</html>
