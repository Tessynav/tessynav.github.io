<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TessyNav v2</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<style>
html,body,#map{margin:0;height:100%;background:#e9ece6}
.hud{position:absolute;background:rgba(10,18,32,.85);color:#e8f1fa;font-family:sans-serif;border-radius:12px;padding:10px 16px;z-index:5}
button.hud{border:0;cursor:pointer}
#status{top:12px;left:12px;font-size:15px}
#tag{top:12px;right:12px;font-size:13px;opacity:.85}
#speed{bottom:24px;left:12px;font-size:34px;font-weight:bold}
#speed small{font-size:15px;font-weight:normal;opacity:.7}
#btn{bottom:24px;right:12px;font-size:18px}
.zb{right:12px;font-size:26px;width:56px;height:56px;padding:0;line-height:56px;text-align:center}
#zin{bottom:160px}
#zout{bottom:96px}
#rec{top:64px;left:12px;font-size:15px}
#ver{bottom:24px;left:50%;transform:translateX(-50%);font-size:13px;opacity:.85}
#panel{display:none;top:50%;left:50%;transform:translate(-50%,-50%);font-size:17px;text-align:center;max-width:80vw;z-index:9}
.pbtn{font-size:16px;padding:10px 18px;border:0;border-radius:10px;background:#2bb3a3;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="map"></div>
<div id="status" class="hud">Tap Start to follow Tessy</div>
<div id="tag" class="hud">TessyNav v2 · test</div>
<button id="rec" class="hud">● Record</button>
<div id="speed" class="hud">0 <small>km/h</small></div>
<button id="ver" class="hud">Version</button>
<button id="btn" class="hud">Start</button>
<button id="zin" class="hud zb">+</button>
<button id="zout" class="hud zb">−</button>
<div id="panel" class="hud"></div>
<script src="js/roads.js?v=8"></script>
<script src="js/track.js?v=7"></script>
<script src="js/scene.js?v=8"></script>
<script src="js/trees.js?v=3"></script>
<script src="js/rec.js?v=2"></script>
<script src="js/app.js?v=18"></script>
</body>
</html>
