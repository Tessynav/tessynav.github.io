<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TessyNav v2</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<style>
html,body,#map{margin:0;height:100%;background:#e9ece6}
.hud{position:absolute;background:rgba(10,18,32,.88);color:#e8f1fa;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;border-radius:16px;padding:10px 16px;z-index:5;transition:opacity .6s;box-shadow:0 2px 10px rgba(0,0,0,.25)}
body.tn-intro .hud:not(#panel){opacity:0;pointer-events:none}
#tn-boot{position:absolute;left:0;top:0;width:100%;height:100%;background:#080e1a;z-index:49;transition:opacity .35s}
#tn-upd{position:absolute;left:0;top:0;width:100%;height:100%;z-index:60;background:rgba(8,14,26,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:sans-serif;color:#e8f1fa;transition:opacity .4s}
#tn-upd .shot{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:-1;opacity:.6}
#tn-upd .t,#tn-upd .bar,#tn-upd .s{position:relative}
#tn-upd .t{font-size:22px;letter-spacing:.5px}#tn-upd .s{font-size:14px;color:#9fd7f0;min-height:18px}
#tn-upd .bar{width:min(70%,420px);height:8px;border-radius:4px;background:rgba(120,220,255,.18);overflow:hidden}
#tn-upd .fill{height:100%;width:0;background:#78dcff;border-radius:4px;transition:width .35s}
button.hud{border:0;cursor:pointer}
#status{top:16px;left:16px;font-size:16px;max-width:42vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status .g{color:#9fb3c8;font-size:14px}
#tag{display:none}
#speed{bottom:24px;left:16px;font-size:40px;font-weight:600;padding:10px 18px;line-height:1}
#speed small{font-size:15px;font-weight:normal;opacity:.7}
#btn{bottom:24px;right:16px;font-size:18px;padding:12px 20px}
.zb{right:16px;font-size:26px;width:56px;height:56px;padding:0;line-height:56px;text-align:center}
#zin{bottom:160px}
#zout{bottom:96px}
#rec{top:70px;left:16px;font-size:14px;padding:8px 14px}
#ver{bottom:24px;left:50%;transform:translateX(-50%);font-size:13px;opacity:.85}
#panel{display:none;top:50%;left:50%;transform:translate(-50%,-50%);font-size:17px;text-align:center;max-width:80vw;z-index:9}
.pbtn{font-size:16px;padding:10px 18px;border:0;border-radius:10px;background:#2bb3a3;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="tn-boot"></div>
<script>
/* the opening animation starts dark from the first moment (no blank screen); skipped after an update or with ?intro=0 */
/* after an update (reload): a faded "Updating TessyNav" screen with a progress bar instead of a blank page */
window.TN_PROGRESS=function(){};
(function(){let upd=false;try{upd=/[?&]r=\d/.test(location.search)||!!sessionStorage.getItem('tn2_target');}catch(e){}
  if(!upd) return;
  const d=document.createElement('div');d.id='tn-upd';
  d.innerHTML='<div class="t">Updating TessyNav</div><div class="bar"><div class="fill"></div></div><div class="s">Loading the new version… 0%</div>';
  /* the map as it looked just before the update, faded behind the progress bar */
  try{const shot=sessionStorage.getItem('tn2_shot');if(shot){const im=document.createElement('img');im.className='shot';im.src=shot;d.insertBefore(im,d.firstChild);
    d.style.background='rgba(8,14,26,.45)';sessionStorage.removeItem('tn2_shot');}}catch(e){}
  document.body.appendChild(d);
  let cur=0;
  window.TN_PROGRESS=function(p,label){p=Math.max(cur,Math.min(100,Math.round(p)));cur=p;
    d.querySelector('.fill').style.width=p+'%';d.querySelector('.s').textContent=(label||'Loading the new version…')+' '+p+'%';
    if(p>=100){setTimeout(()=>{d.style.opacity='0';setTimeout(()=>{if(d.parentNode) d.parentNode.removeChild(d);},450);},250);}};
  window.TN_PROGRESS(5,'Loading the new version…');
  /* never stay on this screen if something goes wrong */
  setTimeout(()=>window.TN_PROGRESS(100,'Ready'),12000);
})();
(function(){let on=true;try{if(/[?&]intro=0/.test(location.search)||/[?&]r=\d/.test(location.search)||sessionStorage.getItem('tn2_target')) on=false;
  const st=JSON.parse(localStorage.getItem('tn2_settings')||'{}');if(st&&st.intro===false) on=false;}catch(e){}
  const b=document.getElementById('tn-boot');
  if(!on){b.parentNode.removeChild(b);return;}
  document.body.classList.add('tn-intro');
  /* safety: never stay dark for long if anything goes wrong */
  setTimeout(()=>{const x=document.getElementById('tn-boot');if(x) x.parentNode.removeChild(x);document.body.classList.remove('tn-intro');},9000);
})();
</script>
<div id="map"></div>
<div id="status" class="hud">Finding Tessy…</div>
<div id="tag" class="hud">TessyNav v2 · test</div>
<button id="rec" class="hud">● Record</button>
<div id="speed" class="hud">0 <small>km/h</small></div>
<button id="ver" class="hud">Version</button>
<button id="btn" class="hud">Start</button>
<button id="zin" class="hud zb">+</button>
<button id="zout" class="hud zb">−</button>
<div id="panel" class="hud"></div>
<!-- the app's files (read by the loader below; also what the Version button compares) -->
<template id="tn-files">
<script src="js/roads.js?v=29"></script>
<script src="js/track.js?v=8"></script>
<script src="js/scene.js?v=27"></script>
<script src="js/trees.js?v=5"></script>
<script src="js/buildings.js?v=6"></script>
<script src="js/intro.js?v=4"></script>
<script src="js/rem.js?v=5"></script>
<script src="js/season.js?v=3"></script>
<script src="js/water.js?v=1"></script>
<script src="js/settings.js?v=3"></script>
<script src="js/rec.js?v=2"></script>
<script src="js/app.js?v=37"></script>
</template>
<script>
/* Fast updates: the newest files are loaded straight from the GitHub repo (through jsDelivr's copy of the
   newest commit), so an upload is live within seconds instead of waiting for the website copy (up to 10 min).
   If that is slow (over 3.5 s) or fails, the website's own copy is used, exactly as before.
   ?local=1 in the address always uses the website copy. */
(function(){
  const parse=h=>[...h.matchAll(/<script[^>]+src="(js\/[^"]+)"/g)].map(m=>m[1]);
  const localList=parse(document.getElementById('tn-files').innerHTML);
  const load=(base,list)=>{
    window.TN_FILES=list;window.TN_BASE=base;let i=0;
    const next=()=>{if(i>=list.length) return;const s=document.createElement('script');s.src=base+list[i++];s.async=false;
      s.onload=()=>{try{window.TN_PROGRESS(10+60*i/list.length,'Loading the new version…');}catch(e){}next();};
      s.onerror=()=>{if(base){location.replace(location.pathname+'?local=1&r='+Date.now());}else next();};
      document.body.appendChild(s);};
    next();
  };
  if(/[?&]local=1/.test(location.search)){load('',localList);return;}
  let done=false;const finish=(b,l)=>{if(done) return;done=true;load(b,l);};
  setTimeout(()=>finish('',localList),3500);
  (async()=>{
    try{
      const h={'Accept':'application/vnd.github+json'};let tok='';try{tok=localStorage.getItem('up:token')||'';}catch(e){}
      let r=tok?await fetch('https://api.github.com/repos/Tessynav/tessynav.github.io/commits/main',{headers:Object.assign({'Authorization':'Bearer '+tok},h),cache:'no-store'}):null;
      if(!r||!r.ok) r=await fetch('https://api.github.com/repos/Tessynav/tessynav.github.io/commits/main',{headers:h,cache:'no-store'});
      if(!r.ok) throw 0;
      const sha=(await r.json()).sha;if(!/^[0-9a-f]{40}$/.test(sha)) throw 0;
      const base='https://cdn.jsdelivr.net/gh/Tessynav/tessynav.github.io@'+sha+'/v2/';
      const ih=await fetch(base+'index.html',{cache:'no-store'});if(!ih.ok) throw 0;
      const list=parse(await ih.text());if(!list.length) throw 0;
      finish(base,list);
    }catch(e){finish('',localList);}
  })();
})();
</script>
</body>
</html>
