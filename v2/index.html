<script>/* private until launch: a device that hasn't been unlocked with the owner's private link goes to the Coming soon page, and nothing else loads (no map, no API keys used): the rest of the page becomes plain text, so no other script runs, while the move to Coming soon goes ahead (stopping the page instead also cancelled that move: a white screen) */(function(){var ok=false;try{ok=localStorage.getItem('tn2_access')==='a292d7af1555f35512cac2a92b967747c92a9b77177e0bd85b7c9063b8edfbfc';}catch(e){}if(!ok){location.replace('/soon.html');document.write('<style>html{display:none}</style><plaintext style="display:none">');}})();</script>

/* see-through panels (Settings -> Map and view): the top bar, status, search and buttons let the sky and buildings show
   through, without blur (a blur would be recalculated every frame over the moving 3D view); a soft outline keeps the text

body.tn-glass{--tn-gA:.5}
html[data-theme="teslaDay"] body.tn-glass{--tn-gA:.74}
body.tn-glass :is(#status,#speed,#tn-bar,#tn-search,#rec,#trips,#btn,#zin,#zout,#tn-fbbtn,#tn-report,#tn-end){background:rgb(var(--tn-panel-rgb) / var(--tn-gA))!important;border:1px solid rgba(255,255,255,.15);text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.55)}
html[data-theme="teslaDay"] body.tn-glass :is(#status,#speed,#tn-bar,#tn-search,#rec,#trips,#btn,#zin,#zout,#tn-fbbtn,#tn-report,#tn-end){border-color:rgba(0,0,0,.1);text-shadow:0 0 4px rgba(255,255,255,.95),0 0 8px rgba(255,255,255,.6)}

/* the opening ("Headlights on"): drawn by the page itself, so it starts the moment the page appears, before any

@property --tnr{syntax:'<length>';inherits:false;initial-value:0px}
#tn-boot{position:absolute;left:0;top:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 80%,#141c2c 0%,#080e1a 60%);z-index:49;overflow:hidden;
  -webkit-mask:radial-gradient(circle at 50% 76%,transparent var(--tnr),#000 calc(var(--tnr) + 70px));mask:radial-gradient(circle at 50% 76%,transparent var(--tnr),#000 calc(var(--tnr) + 70px))}

#tn-boot .sub{position:absolute;left:0;right:0;top:calc(30% + clamp(52px,9vw,96px));text-align:center;font:500 clamp(13px,1.8vw,18px) system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#8d96a3;opacity:0;animation:tnNm .7s ease .45s forwards}
@keyframes tnNm{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#tn-boot .road{position:absolute;left:50%;bottom:0;width:70vmin;height:24%;transform:translateX(-50%);background:linear-gradient(transparent,rgba(120,140,170,.10));clip-path:polygon(47% 0,53% 0,100% 100%,0 100%)}
#tn-boot .hl{position:absolute;top:76%;width:clamp(26px,3.4vw,40px);height:clamp(14px,1.8vw,20px);margin-top:-10px;border-radius:50%;background:radial-gradient(ellipse,#fffbe9 0%,#ffe9b0 45%,rgba(255,220,150,0) 72%);opacity:0;
  box-shadow:0 0 30px 10px rgba(255,236,190,.35);animation:tnHl 1.5s linear .3s forwards,tnBr 2.4s ease-in-out 1.8s infinite}
#tn-boot .hl.l{left:calc(50% - clamp(46px,6vw,70px))}#tn-boot .hl.r{left:calc(50% + clamp(20px,2.6vw,30px))}
#tn-boot .beam{position:absolute;left:50%;top:76%;width:46vmin;height:30vmin;transform:translate(-50%,-100%);background:radial-gradient(ellipse at 50% 100%,rgba(255,240,205,.28),rgba(255,240,205,0) 70%);opacity:0;animation:tnHl 1.5s linear .3s forwards,tnBr 2.4s ease-in-out 1.8s infinite}
@keyframes tnHl{0%{opacity:0}10%{opacity:1}24%{opacity:.15}38%{opacity:1}52%{opacity:.2}70%,100%{opacity:.9}}
@keyframes tnBr{0%,100%{opacity:.9}50%{opacity:.6}}
#tn-ring{position:absolute;left:50%;top:76%;width:0;height:0;border-radius:50%;transform:translate(-50%,-50%);z-index:50;pointer-events:none;
  box-shadow:0 0 0 4px rgba(232,145,58,.95),0 0 34px 14px rgba(232,145,58,.55),inset 0 0 26px 6px rgba(232,145,58,.35);animation:tnRing 1.9s cubic-bezier(.45,0,.2,1) forwards}
@keyframes tnRing{0%{width:0;height:0;opacity:1}85%{opacity:.9}100%{width:320vmax;height:320vmax;opacity:0}}
#tn-hi{position:absolute;left:50%;bottom:19%;transform:translateX(-50%) scale(.6);z-index:48;display:flex;align-items:center;gap:12px;padding:10px 18px 10px 12px;border-radius:18px;background:rgb(var(--tn-panel-rgb) / .97);color:var(--tn-text);font:700 20px system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;animation:tnHi 2.6s ease forwards}
@keyframes tnHi{0%{opacity:0;transform:translateX(-50%) translateY(20px) scale(.6)}14%{opacity:1;transform:translateX(-50%) translateY(-4px) scale(1.05)}20%,82%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.9)}}
@media (prefers-reduced-motion:reduce){#tn-boot .hl,#tn-boot .beam{animation:none;opacity:.9}}
#tn-upd{position:absolute;left:0;top:0;width:100%;height:100%;z-index:60;background:rgba(8,14,26,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:sans-serif;color:var(--tn-text);transition:opacity .4s}

/* with the opening playing: no title or background, just a slim progress line low on the screen, under the headlights */
body.tn-intro #tn-upd{background:transparent;justify-content:flex-end;padding-bottom:6vh;box-sizing:border-box;gap:8px;pointer-events:none}
body.tn-intro #tn-upd .t,body.tn-intro #tn-upd .shot{display:none}
body.tn-intro #tn-upd .bar{width:min(40vw,320px)!important;height:3px!important;opacity:.7}

<body>
<div id="tn-boot"><div class="road"></div><div class="beam"></div><div class="hl l"></div><div class="hl r"></div><div class="nm">Tessy<b>Nav</b></div><div class="sub">Navigation for Tesla</div></div>
<script>
window.TN_T0=performance.now();
/* the opening animation starts dark from the first moment (no blank screen); skipped after an update or with ?intro=0 */
/* after an update (reload): a faded "Updating TessyNav" screen with a progress bar instead of a blank page */
window.TN_PROGRESS=function(){};
(function(){let upd=false;try{upd=/[?&]r=\d/.test(location.search)||!!sessionStorage.getItem('tn2_target');}catch(e){}
  if(!upd) return;
  const d=document.createElement('div');d.id='tn-upd';
  d.innerHTML='<div class="t">Updating TessyNav</div><div class="bar"><div class="fill"></div></div><div class="s">Loading the new version… 0%</div>';
  /* the map as it looked just before the update, faded behind the progress bar */
  try{const shot=sessionStorage.getItem('tn2_shot');if(shot){const im=document.createElement('img');im.className='shot';im.src=shot;d.insertBefore(im,d.firstChild);
    d.style.background='rgba(8,14,26,.45)';sessionStorage.removeItem('tn2_shot');}}catch(e){}
  document.body.appendChild(d);
  let cur=0;
  window.TN_PROGRESS=function(p,label){p=Math.max(cur,Math.min(100,Math.round(p)));cur=p;
    d.querySelector('.fill').style.width=p+'%';d.querySelector('.s').textContent=(label||'Loading the new version…')+' '+p+'%';
    if(p>=100){setTimeout(()=>{d.style.opacity='0';setTimeout(()=>{if(d.parentNode) d.parentNode.removeChild(d);},450);},250);}};
  window.TN_PROGRESS(5,'Loading the new version…');
  /* never stay on this screen if something goes wrong */
  setTimeout(()=>window.TN_PROGRESS(100,'Ready'),12000);
})();
/* (the real opening plays after an update too, with a thin progress line under it, instead of the old
   "Updating TessyNav" screen with a faded picture of the map from before) */
(function(){let on=true;try{if(/[?&]intro=0/.test(location.search)) on=false;
  const st=JSON.parse(localStorage.getItem('tn2_settings')||'{}');if(st&&st.intro===false) on=false;}catch(e){}
  const b=document.getElementById('tn-boot');
  if(!on){b.parentNode.removeChild(b);return;}
  document.body.classList.add('tn-intro');
  /* safety: never stay dark for long if anything goes wrong */
  /* safety: if the app hasn't revealed the city after 25 s (a very slow connection), the start screen goes away
     anyway (it was 9 s: on a slow connection the app wasn't ready yet, and its bare buttons showed on a grey page) */
  setTimeout(()=>{const x=document.getElementById('tn-boot');if(x) x.parentNode.removeChild(x);document.body.classList.remove('tn-intro');},25000);
})();
</script>

<script>
/* Fast updates: the newest files are loaded straight from the GitHub repo (through jsDelivr's copy of the
   newest commit), so an upload is live within seconds instead of waiting for the website copy (up to 10 min).
   If that is slow (over 3.5 s) or fails, the website's own copy is used, exactly as before.
   ?local=1 in the address always uses the website copy. */
/* safeguard: if one of the app's files comes back as a web page instead of code (a broken saved copy, or a file
   caught while GitHub was still publishing it), reload once with fresh copies that skip the browser's saved files */
window.addEventListener('error',function(e){
  try{const m=String(e&&e.message||''),f=String(e&&e.filename||'');
    if(!/Unexpected token '<'|expected expression, got '<'|Unexpected token <|Syntax error/i.test(m)) return;
    if(/^https?:/.test(f)&&!/\/js\/[a-z0-9]+\.js/.test(f)) return;   /* (another site's file: not ours to fix) */
    if(sessionStorage.getItem('tn2_bust')) return;sessionStorage.setItem('tn2_bust','1');
    location.replace(location.pathname+'?local=1&bust='+Date.now());}catch(x){}
},true);
(function(){
  const parse=h=>[...h.matchAll(/<script[^>]+src="(js\/[^"]+)"/g)].map(m=>m[1]);
  /* fresh copies, skipping the browser's saved files: after a safeguard reload (bust=), and whenever the page is
     opened with ?r= (after an update, or by hand to refresh), so an old file saved under a new version name can't stay */
  const bust=/[?&](bust|r)=\d/.test(location.search)?String(Date.now()):'';
  const localList=parse(document.getElementById('tn-files').innerHTML);
  const load=(base,list)=>{
    window.TN_FILES=list;window.TN_BASE=base;let i=0;
    const next=()=>{if(i>=list.length){setTimeout(()=>{try{sessionStorage.removeItem('tn2_bust');}catch(e){}},8000);return;}
      const s=document.createElement('script');const f=list[i++];s.src=base+f+(bust?(f.indexOf('?')>=0?'&':'?')+'b='+bust:'');s.async=false;
      s.onload=()=>{try{window.TN_PROGRESS(10+60*i/list.length,'Loading the new version…');}catch(e){}next();};
      s.onerror=()=>{if(base){location.replace(location.pathname+'?local=1&r='+Date.now());}else next();};
      document.body.appendChild(s);};
    next();
  };
  if(/[?&]local=1/.test(location.search)){load('',localList);return;}
  let done=false;const finish=(b,l)=>{if(done) return;done=true;load(b,l);};
  setTimeout(()=>finish('',localList),3500);
  (async()=>{
    try{
      const h={'Accept':'application/vnd.github+json'};let tok='';try{tok=localStorage.getItem('up:token')||'';}catch(e){}
      let r=tok?await fetch('https://api.github.com/repos/Tessynav/tessynav.github.io/commits/main',{headers:Object.assign({'Authorization':'Bearer '+tok},h),cache:'no-store'}):null;
      if(!r||!r.ok) r=await fetch('https://api.github.com/repos/Tessynav/tessynav.github.io/commits/main',{headers:h,cache:'no-store'});
      if(!r.ok) throw 0;
      const sha=(await r.json()).sha;if(!/^[0-9a-f]{40}$/.test(sha)) throw 0;
      const base='https://cdn.jsdelivr.net/gh/Tessynav/tessynav.github.io@'+sha+'/v2/';
      const ih=await fetch(base+'index.html',{cache:'no-store'});if(!ih.ok) throw 0;
      const list=parse(await ih.text());if(!list.length) throw 0;
      finish(base,list);
    }catch(e){finish('',localList);}
  })();
})();
</script>
