<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TessyNav</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<style>
html,body,#map{margin:0;height:100%}
.hud{position:absolute;background:rgba(10,18,32,.85);color:#e8f1fa;font-family:sans-serif;border-radius:12px;padding:10px 16px}
#status{top:12px;left:12px;font-size:15px}
#dbg{top:64px;left:12px;font-size:13px}
#trees{top:12px;right:56px;font-size:14px}
#speed{bottom:24px;left:12px;font-size:34px;font-weight:bold}
#speed small{font-size:15px;font-weight:normal;opacity:.7}
#btn{bottom:24px;right:12px;font-size:18px;border:0;cursor:pointer}
</style>
</head>
<body>
<div id="map"></div>
<div id="status" class="hud">Tap Start to follow Tessy</div>
<div id="dbg" class="hud">Tree renders: 0</div>
<div id="trees" class="hud">Trees: 0</div>
<div id="speed" class="hud">0 <small>km/h</small></div>
<button id="btn" class="hud">Start</button>
<script>
const R=Math.PI/180;
function dist(a,b){const dLat=(b[1]-a[1])*R,dLng=(b[0]-a[0])*R;const h=Math.sin(dLat/2)**2+Math.cos(a[1]*R)*Math.cos(b[1]*R)*Math.sin(dLng/2)**2;return 12742000*Math.asin(Math.sqrt(h));}
function bearing(a,b){const y=Math.sin((b[0]-a[0])*R)*Math.cos(b[1]*R);const x=Math.cos(a[1]*R)*Math.sin(b[1]*R)-Math.sin(a[1]*R)*Math.cos(b[1]*R)*Math.cos((b[0]-a[0])*R);return (Math.atan2(y,x)/R+360)%360;}

const ORIGIN=[-73.568,45.459];
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:ORIGIN,zoom:17,pitch:60});
const treesEl=document.getElementById('trees'),dbgEl=document.getElementById('dbg');

/* ---------- Smooth 3D trees (three.js) ---------- */
const MAXT=30000;
let treeCount=0,trunkMesh=null,leafMesh=null,topMesh=null,treesFailed=false,renders=0;
const cells=new Set(),seen=new Set(),doneAreas=new Set();
const leafCols=['#5b7f3a','#4f7334','#6a8a42','#7d8a3a','#b9772f','#a8552a'].map(c=>new THREE.Color(c));
const tM=new THREE.Matrix4(),tQ=new THREE.Quaternion(),tS=new THREE.Vector3(),tP=new THREE.Vector3();

const treeLayer={
  id:'trees3d',type:'custom',renderingMode:'3d',
  onAdd(m,gl){
    try{
      this.camera=new THREE.Camera();
      this.scene=new THREE.Scene();
      this.scene.add(new THREE.HemisphereLight(0xeef6ff,0x5a6b4a,2.4));
      const sun=new THREE.DirectionalLight(0xffffff,2.0);sun.position.set(-40,80,30);this.scene.add(sun);
      const test=new THREE.Mesh(new THREE.BoxGeometry(20,60,20),new THREE.MeshBasicMaterial({color:0xff0000}));
      test.position.set(0,30,0);this.scene.add(test);
      const trunkGeo=new THREE.CylinderGeometry(0.18,0.28,3.2,6);
      const ball=new THREE.SphereGeometry(1,14,10);
      trunkMesh=new THREE.InstancedMesh(trunkGeo,new THREE.MeshLambertMaterial({color:0x5a4030}),MAXT);
      leafMesh=new THREE.InstancedMesh(ball,new THREE.MeshLambertMaterial({color:0xffffff}),MAXT);
      topMesh=new THREE.InstancedMesh(ball,new THREE.MeshLambertMaterial({color:0xffffff}),MAXT);
      for(const mm of [leafMesh,topMesh]) mm.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(MAXT*3),3);
      for(const mm of [trunkMesh,leafMesh,topMesh]){mm.count=0;mm.frustumCulled=false;this.scene.add(mm);}
      this.renderer=new THREE.WebGLRenderer({canvas:m.getCanvas(),context:gl,antialias:true});
      this.renderer.autoClear=false;
      const mc=maplibregl.MercatorCoordinate.fromLngLat(ORIGIN,0),sc=mc.meterInMercatorCoordinateUnits();
      this.model=new THREE.Matrix4().makeTranslation(mc.x,mc.y,mc.z).scale(new THREE.Vector3(sc,-sc,sc)).multiply(new THREE.Matrix4().makeRotationX(Math.PI/2));
    }catch(e){treesFailed=true;treesEl.textContent='3D trees error: '+e.message;}
  },
  render(gl,matrix){
    if(treesFailed) return;
    try{
      renders++; if(renders%20===1) dbgEl.textContent='Tree renders: '+renders;
      this.camera.projectionMatrix=new THREE.Matrix4().fromArray(matrix).multiply(this.model);
      this.renderer.resetState();
      this.renderer.setViewport(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight);
      this.renderer.render(this.scene,this.camera);
    }catch(e){treesFailed=true;treesEl.textContent='3D trees error: '+e.message;}
  }
};

function addTree(seed,lng,lat){
  if(!leafMesh||treesFailed||treeCount>=MAXT) return false;
  const k=Math.round(lng*9000)+','+Math.round(lat*12000);
  if(cells.has(k)) return false; cells.add(k);
  const x=(lng-ORIGIN[0])*111320*Math.cos(ORIGIN[1]*R), z=-(lat-ORIGIN[1])*111320;
  const s=0.8+Math.random()*0.45, col=leafCols[seed%leafCols.length], i=treeCount;
  tP.set(x,1.6*s,z);tS.set(s,s,s);tM.compose(tP,tQ,tS);trunkMesh.setMatrixAt(i,tM);
  tP.set(x,4.6*s,z);tS.set(2.6*s,2.3*s,2.6*s);tM.compose(tP,tQ,tS);leafMesh.setMatrixAt(i,tM);leafMesh.setColorAt(i,col);
  tP.set(x+(Math.random()-.5)*s,6.3*s,z+(Math.random()-.5)*s);tS.set(1.7*s,1.6*s,1.7*s);tM.compose(tP,tQ,tS);topMesh.setMatrixAt(i,tM);topMesh.setColorAt(i,col);
  treeCount++; return true;
}
function refreshTrees(){
  if(!leafMesh||treesFailed) return;
  for(const mm of [trunkMesh,leafMesh,topMesh]){mm.count=treeCount;mm.instanceMatrix.needsUpdate=true;if(mm.instanceColor)mm.instanceColor.needsUpdate=true;}
  treesEl.textContent='Trees: '+treeCount;
  map.triggerRepaint();
}

let lastFetch=null,busy=false;
async function loadTrees(){
  if(busy||map.getZoom()<15.5)return;
  const c=map.getCenter(),p=[c.lng,c.lat];
  if(lastFetch&&dist(lastFetch,p)<200)return;
  busy=true;lastFetch=p;
  const d=0.005,s=c.lat-d,n=c.lat+d,w=c.lng-d*1.4,e=c.lng+d*1.4;
  try{
    const q='[out:json][timeout:15];node["natural"="tree"]('+s+','+w+','+n+','+e+');out;';
    const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));
    const j=await r.json();
    for(const t of j.elements){if(!seen.has(t.id)){seen.add(t.id);addTree(t.id,t.lon,t.lat);}}
    refreshTrees();
  }catch(err){if(!treesFailed)treesEl.textContent='Trees: '+treeCount+' (tree service error)';lastFetch=null;}
  busy=false;
}

function inside(pt,rg){let ins=false;for(let i=0,j=rg.length-1;i<rg.length;j=i++){const xi=rg[i][0],yi=rg[i][1],xj=rg[j][0],yj=rg[j][1];if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function parkTrees(){
  if(map.getZoom()<15.5||!leafMesh||treesFailed)return;
  let added=0;
  const feats=map.querySourceFeatures('openmaptiles',{sourceLayer:'park'})
    .concat(map.querySourceFeatures('openmaptiles',{sourceLayer:'landcover',filter:['==',['get','class'],'wood']}));
  for(const f of feats){
    const g=f.geometry;
    const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];
    for(const poly of polys){
      const rg=poly[0]; if(!rg||rg.length<4) continue;
      const key=rg[0][0].toFixed(5)+','+rg[0][1].toFixed(5)+','+rg.length;
      if(doneAreas.has(key)) continue; doneAreas.add(key);
      let minX=180,minY=90,maxX=-180,maxY=-90;
      for(const p of rg){minX=Math.min(minX,p[0]);maxX=Math.max(maxX,p[0]);minY=Math.min(minY,p[1]);maxY=Math.max(maxY,p[1]);}
      const area=(maxX-minX)*111320*Math.cos(minY*R)*(maxY-minY)*111320;
      const n=Math.min(60,Math.floor(area/700));
      for(let i=0,tries=0;i<n&&tries<n*4;tries++){
        const pt=[minX+Math.random()*(maxX-minX),minY+Math.random()*(maxY-minY)];
        if(inside(pt,rg)){if(addTree(Math.floor(Math.random()*600),pt[0],pt[1]))added++;i++;}
      }
    }
  }
  if(added) refreshTrees();
}

/* ---------- Map styling ---------- */
function roadWidth(z13,z20){
  const m=v=>['match',['get','class'],['motorway','trunk','primary'],v[0],['secondary','tertiary'],v[1],'minor',v[2],v[3]];
  return ['interpolate',['exponential',2],['zoom'],13,m(z13),20,m(z20)];
}
map.on('load',()=>{
  for(const l of map.getStyle().layers){
    if(l.type==='symbol'&&/poi|transit|parking/i.test(l.id)) map.setLayoutProperty(l.id,'visibility','none');
  }
  if(!map.getLayer('building-3d')){
    map.addLayer({id:'building-3d',type:'fill-extrusion',source:'openmaptiles','source-layer':'building',
      paint:{'fill-extrusion-height':['coalesce',['get','render_height'],8],
      'fill-extrusion-base':['coalesce',['get','render_min_height'],0]}});
  }
  for(const l of map.getStyle().layers){
    if(l.type!=='line'||l['source-layer']!=='transportation') continue;
    if(/rail|path|ferry|aerialway|pier/i.test(l.id)) continue;
    if(/casing/i.test(l.id)){
      map.setPaintProperty(l.id,'line-color','#b9b4aa');
      map.setPaintProperty(l.id,'line-width',roadWidth([3,2.5,1.5,0.8],[136,104,82,44]));
    }else{
      map.setPaintProperty(l.id,'line-color','#4b4f56');
      map.setPaintProperty(l.id,'line-width',roadWidth([2,1.5,1,0.5],[120,90,70,35]));
    }
  }
  map.addLayer({id:'lane-lines',type:'line',source:'openmaptiles','source-layer':'transportation',minzoom:16,
    filter:['in',['get','class'],['literal',['motorway','trunk','primary','secondary','tertiary','minor']]],
    paint:{'line-color':['match',['get','class'],['motorway','trunk','primary'],'#e2b21f','#f2f2ee'],
      'line-width':['interpolate',['exponential',2],['zoom'],16,0.6,19,2],
      'line-dasharray':[4,4]}},'building-3d');
  map.setPaintProperty('building-3d','fill-extrusion-color',['interpolate',['linear'],['coalesce',['get','render_height'],8],0,'#e3d5c1',10,'#d9c7b0',20,'#cfd3d6',60,'#b9c3cc']);
  map.setPaintProperty('building-3d','fill-extrusion-opacity',1);
  map.addLayer({id:'roofs',type:'fill-extrusion',source:'openmaptiles','source-layer':'building',
    paint:{'fill-extrusion-color':'#9a958d',
      'fill-extrusion-base':['coalesce',['get','render_height'],8],
      'fill-extrusion-height':['+',['coalesce',['get','render_height'],8],0.4]}});
  map.addLayer(treeLayer);
  loadTrees();
  map.on('moveend',loadTrees);
  map.on('idle',parkTrees);
});

/* ---------- Driving view ---------- */
const el=document.createElement('div');
el.innerHTML='<svg viewBox="0 0 34 34" width="52" height="52"><path d="M17 3 L29 30 L17 23 L5 30 Z" fill="#3fd1b0" stroke="#fff" stroke-width="2"/></svg>';
const car=new maplibregl.Marker({element:el,rotationAlignment:'map',pitchAlignment:'map'}).setLngLat(ORIGIN).addTo(map);
let follow=false,last=null,heading=0,watchId=null;
const status=document.getElementById('status'),speedEl=document.getElementById('speed'),btn=document.getElementById('btn');
function view(pos,ms){map.easeTo({center:pos,zoom:18,pitch:65,bearing:heading,duration:ms,offset:[0,150]});}
function onPos(p){
  const pos=[p.coords.longitude,p.coords.latitude];
  if(p.coords.heading!=null&&!isNaN(p.coords.heading)&&(p.coords.speed||0)>1) heading=p.coords.heading;
  else if(last&&dist(last,pos)>4) heading=bearing(last,pos);
  if(!last||dist(last,pos)>4) last=pos;
  car.setLngLat(pos).setRotation(heading);
  speedEl.innerHTML=Math.round((p.coords.speed||0)*3.6)+' <small>km/h</small>';
  status.textContent='GPS accuracy: '+Math.round(p.coords.accuracy)+' m';
  if(follow) view(pos,1000);
}
btn.onclick=()=>{
  follow=true;btn.textContent='Recenter';
  if(watchId===null){watchId=navigator.geolocation.watchPosition(onPos,()=>{status.textContent='Location not available';},{enableHighAccuracy:true,maximumAge:0,timeout:15000});}
  else if(last) view(last,800);
};
map.on('dragstart',()=>{follow=false;});
</script>
</body>
</html>
