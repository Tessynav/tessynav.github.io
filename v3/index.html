#ctl button.rec{background:#c62828;color:#fff}

#load{left:50%;top:45%;transform:translate(-50%,-50%);font-weight:600}

@media (max-width:560px){#ctl{bottom:70px;flex-wrap:wrap;justify-content:center;width:calc(100% - 32px)}#stats{display:none}}

  window.removeEventListener('error',onErr);if(err) throw new Error(src+': '+err);}

try{await fresh('nav.js');}catch(e){console.error('nav.js',e);}   /* (step 6) navigation, part 1 */   /* (step 6) the Tesla connection, the same as v2's */

/* (step 6) Settings: the gear button. Choices apply right away and are remembered in this browser */
function setPanel(){
  const rows=document.getElementById('setRows'),seg=(k,opts)=>'<div class="seg">'+opts.map(([v,t])=>'<button data-k="'+k+'" data-v="'+v+'" class="'+(SET[k]===v?'on':'')+'">'+t+'</button>').join('')+'</div>',
    tg=k=>'<button class="tg'+(SET[k]?' on':'')+'" data-k="'+k+'" data-t="1">'+(SET[k]?'On':'Off')+'</button>';
  rows.innerHTML='<h3>Map</h3>'+
    '<div class="row"><div>Time of day<small>Auto: night from 4:30 pm to 7 am</small></div>'+seg('time',[['auto','Auto'],['day','Day'],['night','Night']])+'</div>'+
    '<h3>Navigation</h3>'+
    '<div class="row"><div>Spoken directions</div>'+tg('voice')+'</div>'+
    '<h3>Charging</h3>'+
    '<div class="row"><div>Superchargers on the map</div>'+tg('chargers')+'</div>'+
    '<div class="row"><div>Other fast chargers<small>Blue pins, from other networks</small></div>'+tg('fastdc')+'</div>'+
    '<h3>Tesla</h3>'+teslaRow()+
    '<h3>Drives</h3>'+
    '<div class="row"><div>Record button<small>Record your drives to send them for checking</small></div>'+tg('record')+'</div>';
  const tin=document.getElementById('tsIn'),tout=document.getElementById('tsOut');
  if(tin) tin.onclick=()=>{try{localStorage.setItem('tn2_tesla_return',location.pathname);}catch(e){}TN.tesla.signIn();};
  if(tout) tout.onclick=()=>{TN.tesla.signOut();setPanel();};
  rows.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;SET[k]=b.dataset.t?!SET[k]:b.dataset.v;saveSet();applySet(k);setPanel();});
  document.getElementById('setVer').textContent='MapKoon v3 · page '+PAGEV+(MAP_T?' · map '+new Date(MAP_T).toLocaleString('en-CA',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'');}
function teslaRow(){
  const T=globalThis.TN&&TN.tesla;if(!T) return '<div class="row"><div>Tesla connection<small>Not available right now</small></div></div>';
  if(!T.connected()) return '<div class="row"><div>Connect your Tesla<small>Your car\'s real colour now; trips from your Tesla and Send to Tesla come with navigation</small></div><button class="tg" id="tsIn">Connect</button></div>';
  const a=T.load()||{},ci=TN.carInfo||{};
  return '<div class="row"><div>Connected'+(a.name?': '+a.name.replace(/[<>&]/g,''):'')+'<small>'+[ci.model,ci.color].filter(Boolean).join(' · ').replace(/[<>&]/g,'')+'</small></div><button class="tg" id="tsOut">Disconnect</button></div>';}
function applySet(k){
  try{globalThis.TN=globalThis.TN||{};TN.settings=Object.assign(TN.settings||{},{voice:SET.voice});}catch(e){}   /* (v2's voice reads TN.settings.voice) */
  if(k==='time'){const n=SET.time==='night'?true:SET.time==='day'?false:autoNight();if(n!==night){night=n;sky();}}
  if((k==='chargers'||k==='fastdc')&&CHG) CHG.set(SET.chargers,SET.fastdc);
  if(k==='record') document.getElementById('bRec').style.display=SET.record||rec.rec?'':'none';}
document.getElementById('bSet').onclick=()=>{setPanel();document.getElementById('set').style.display='block';};
document.querySelector('#set .done').onclick=()=>{document.getElementById('set').style.display='none';};
document.getElementById('set').onclick=e=>{if(e.target.id==='set') e.target.style.display='none';};
applySet('record');applySet('voice');
/* Auto: night comes on by itself at 4:30 pm and goes off at 7 am, even while the app stays open */
setInterval(()=>{if(SET.time==='auto'&&!Q.get('night')){const n=autoNight();if(n!==night){night=n;sky();}}},60000);
document.getElementById('bStats').onclick=e=>{showStats=!showStats;e.target.classList.toggle('on',showStats);};
document.getElementById('bFollow').onclick=e=>{follow=!follow;e.target.classList.toggle('on',follow);e.target.textContent=follow?'Follow car':'Move map';ctrl.enabled=!follow;if(!follow) ctrl.target.copy(car.position);};
window.V3={S,R,cam,onFix,look:(cx,cy,cz,tx,tz)=>{follow=false;ctrl.enabled=true;ctrl.target.set(tx,0,tz);cam.position.set(cx,cy,cz);},info:()=>R.info.render,net:()=>NET};
start();
</script></body></html>
